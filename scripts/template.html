<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      :root {
        --blue: #00cae0;
        --black: #000000;
        --white: #ffffff;
        --laser: linear-gradient(100deg, #e4b8f7 0%, #b4c4f6 45%, #19ecff 100%);
        --bright: linear-gradient(150deg, #ffffff 0%, #8ae9f3 35%, #00cae0 62%, #2f6bff 100%);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--black); }
      body { font-family: "Outfit", sans-serif; color: var(--white); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--black); }

      /* ---------- background ---------- */
      #bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
      .blob { position: absolute; border-radius: 50%; }
      #blob1 { width: 1100px; height: 1100px; left: -380px; top: 260px;
        background: radial-gradient(circle, rgba(0, 202, 224, 0.34) 0%, rgba(0, 202, 224, 0) 64%); }
      #blob2 { width: 1000px; height: 1000px; right: -420px; top: 1050px;
        background: radial-gradient(circle, rgba(47, 107, 255, 0.26) 0%, rgba(47, 107, 255, 0) 64%); }
      #blob3 { width: 760px; height: 760px; right: -240px; top: -260px;
        background: radial-gradient(circle, rgba(228, 184, 247, 0.16) 0%, rgba(228, 184, 247, 0) 64%); }
      #grid { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2100px;
        background-image: radial-gradient(rgba(255, 255, 255, 0.16) 2px, rgba(255, 255, 255, 0) 2.6px);
        background-size: 48px 48px; }
      .bignum { position: absolute; right: -30px; top: 40px; font-size: 520px; font-weight: 900; line-height: 1;
        letter-spacing: -20px; color: rgba(0, 0, 0, 0); -webkit-text-stroke: 3px rgba(0, 202, 224, 0.26); opacity: 0; }
      .mark { position: absolute; width: 34px; height: 34px; }
      .mark::before, .mark::after { content: ""; position: absolute; background: rgba(255, 255, 255, 0.5); }
      .mark::before { left: 16px; top: 0; width: 2px; height: 34px; }
      .mark::after { top: 16px; left: 0; height: 2px; width: 34px; }
      #ring1 { position: absolute; width: 1400px; height: 1400px; left: -160px; top: 300px; border-radius: 50%;
        border: 2px solid rgba(0, 202, 224, 0.18); }
      #ring2 { position: absolute; width: 1700px; height: 1700px; left: -310px; top: 150px; border-radius: 50%;
        border: 2px dashed rgba(255, 255, 255, 0.1); }

      /* ---------- camera card ---------- */
      #stage { position: absolute; left: 40px; top: 500px; width: 1000px; height: 1000px; z-index: 5; perspective: 2000px; }
      #card { position: absolute; inset: 0; border-radius: 44px; overflow: hidden; background: #000;
        border: 3px solid rgba(0, 202, 224, 0.7);
        box-shadow: 0 0 80px rgba(0, 202, 224, 0.28), 0 50px 120px rgba(0, 0, 0, 0.9); transform-style: preserve-3d; }
      #vw { position: absolute; left: 0; top: 0; width: 2010px; height: 1080px; transform-origin: 0 0; }
      #vw video, #vw img.full { position: absolute; left: 0; top: 0; width: 2010px; height: 1080px; }
      #afterwrap { position: absolute; left: 0; top: 0; width: 2010px; height: 1080px; clip-path: inset(0 0 0 100%); }
      #before { opacity: 0; }
      #divider { position: absolute; top: 0; width: 6px; height: 1080px; left: 2010px; background: var(--white);
        box-shadow: 0 0 30px var(--blue); opacity: 0; }
      #spot { position: absolute; left: 0; top: 0; width: 100px; height: 60px; border-radius: 14px;
        border: 4px solid var(--blue); box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55), 0 0 24px rgba(0, 202, 224, 0.9);
        opacity: 0; }
      .rip { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%;
        border: 6px solid var(--blue); background: rgba(0, 202, 224, 0.25); opacity: 0; }
      #gloss { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 60% at 20% 0%, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 55%); }
      #flash { position: absolute; inset: 0; background: var(--white); opacity: 0; }
      #chrome { position: absolute; left: 0; top: 0; right: 0; height: 64px; background: rgba(0, 0, 0, 0.85);
        display: flex; align-items: center; gap: 14px; padding-left: 28px; opacity: 0; }
      #chrome i { width: 18px; height: 18px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); }
      #chrome i:first-child { background: var(--blue); }

      /* ---------- scene overlays ---------- */
      .scene { position: absolute; inset: 0; z-index: 10; opacity: 0; }
      .pill { position: absolute; left: 60px; top: 92px; display: flex; align-items: center; gap: 14px;
        padding: 12px 26px 12px 18px; border-radius: 40px; border: 2px solid rgba(0, 202, 224, 0.8);
        background: rgba(0, 202, 224, 0.12); font-size: 28px; font-weight: 700; letter-spacing: 4px; }
      .pill .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 16px var(--blue); }
      .head { position: absolute; left: 56px; top: 170px; width: 970px; }
      .hl { overflow: hidden; padding-bottom: 6px; }
      .w { display: inline-block; font-size: 124px; font-weight: 900; line-height: 1.0; letter-spacing: -3px; }
      .w.c { color: var(--blue); }
      .w.laser { background: var(--laser); -webkit-background-clip: text; background-clip: text; color: rgba(0, 0, 0, 0); }
      .band { position: absolute; left: 50px; right: 50px; top: 1548px; height: 220px; display: flex;
        align-items: center; justify-content: center; }
      .phrase { position: absolute; left: 0; right: 0; text-align: center; font-size: 60px; font-weight: 700;
        line-height: 1.15; opacity: 0; }
      .phrase b { color: var(--blue); font-weight: 900; }

      .crumbs { position: absolute; left: 56px; top: 432px; display: flex; gap: 12px; }
      .crumb { padding: 6px 18px; border-radius: 30px; font-size: 26px; font-weight: 700;
        border: 2px solid rgba(255, 255, 255, 0.35); color: rgba(255, 255, 255, 0.75); background: rgba(0, 0, 0, 0.5); }

      .assets { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1600px; }
      .acard { position: absolute; top: 560px; width: 188px; height: 250px; border-radius: 24px; overflow: hidden;
        background: #000; border: 3px solid var(--white); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 202, 224, 0.35); }
      .acard img { width: 100%; height: 100%; object-fit: cover; }
      .acard span { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 0; text-align: center;
        font-size: 22px; font-weight: 800; letter-spacing: 3px; background: var(--blue); color: var(--black); }
      #s3-a0 { left: 40px; } #s3-a1 { left: 243px; } #s3-a2 { left: 446px; } #s3-a3 { left: 649px; } #s3-a4 { left: 852px; }
      .acard.audio { background: var(--bright); }
      .wave { position: absolute; left: 22px; right: 22px; top: 40px; height: 140px; display: flex; align-items: center; gap: 8px; }
      .wave i { flex: 1; border-radius: 6px; background: var(--black); }
      .limits { position: absolute; left: 60px; right: 60px; top: 1330px; display: flex; gap: 20px; }
      .limits div { flex: 1; text-align: center; padding: 18px 0 20px; border-radius: 28px; background: rgba(0, 0, 0, 0.82);
        border: 3px solid var(--blue); font-size: 28px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
      .limits b { display: block; font-size: 88px; line-height: 1; color: var(--blue); letter-spacing: 0; }

      .glass { position: absolute; left: 70px; right: 70px; top: 1150px; padding: 30px 36px 30px; border-radius: 32px;
        background: rgba(0, 0, 0, 0.84); border: 3px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 202, 224, 0.3); }
      .glab { font-size: 22px; font-weight: 800; letter-spacing: 5px; color: var(--blue); margin-bottom: 12px; }
      .tw { display: block; font-size: 34px; font-weight: 500; line-height: 1.35; white-space: nowrap; clip-path: inset(0 100% 0 0); }
      .tw.big { font-size: 46px; font-weight: 700; }
      .tags { display: flex; gap: 14px; margin-top: 18px; }
      .tags span { padding: 8px 22px; border-radius: 30px; background: var(--blue); color: var(--black);
        font-size: 24px; font-weight: 800; letter-spacing: 3px; }

      .model { position: absolute; left: 60px; top: 448px; font-size: 30px; font-weight: 800; letter-spacing: 6px;
        padding: 6px 20px; border-radius: 12px; background: var(--laser); color: var(--black); }
      .specs { position: absolute; left: 60px; right: 60px; top: 1300px; display: flex; gap: 20px; perspective: 1400px; }
      .spec { flex: 1; height: 170px; border-radius: 30px; background: rgba(0, 0, 0, 0.86); border: 3px solid var(--blue);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        box-shadow: 0 0 40px rgba(0, 202, 224, 0.35); }
      .spec small { font-size: 22px; font-weight: 700; letter-spacing: 4px; color: rgba(255, 255, 255, 0.85); }
      .spec b { font-size: 72px; font-weight: 900; color: var(--blue); line-height: 1.05; }
      .specs.bf .spec { height: 120px; background: var(--laser); border: none; }
      .specs.bf .spec b { font-size: 38px; color: var(--black); }

      .checks { position: absolute; left: 60px; right: 60px; top: 1290px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .chk { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-radius: 26px; background: rgba(0, 0, 0, 0.86);
        border: 3px solid var(--blue); font-size: 38px; font-weight: 800; }
      .chk i { width: 54px; height: 54px; border-radius: 50%; background: var(--laser); color: var(--black); font-style: normal;
        display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; flex: none; }
      .credits { position: absolute; right: 70px; top: 1300px; padding: 18px 34px; border-radius: 28px;
        background: rgba(0, 0, 0, 0.88); border: 3px solid var(--blue); text-align: right; }
      .credits small { display: block; font-size: 22px; letter-spacing: 5px; font-weight: 700; }
      .credits b { font-size: 84px; font-weight: 900; color: var(--blue); font-variant-numeric: tabular-nums; line-height: 1; }
      .loader { position: absolute; left: 70px; top: 1300px; width: 300px; height: 150px; border-radius: 28px;
        background: rgba(0, 0, 0, 0.88); border: 3px solid rgba(255, 255, 255, 0.5); display: flex; align-items: center; gap: 18px; padding-left: 24px; }
      .loader svg { width: 90px; height: 90px; }
      .loader circle { fill: none; stroke: var(--blue); stroke-width: 12; stroke-linecap: round;
        stroke-dasharray: 314; stroke-dashoffset: 230; transform-origin: 60px 60px; }
      .loader span { font-size: 24px; font-weight: 800; letter-spacing: 3px; }

      .chips { position: absolute; left: 0; right: 0; top: 1405px; display: flex; justify-content: center; gap: 16px; }
      .chips span { padding: 10px 26px; border-radius: 30px; background: rgba(0, 0, 0, 0.82); border: 3px solid var(--blue);
        font-size: 28px; font-weight: 800; letter-spacing: 3px; }
      .ba-tag { position: absolute; top: 540px; padding: 10px 28px; border-radius: 30px; font-size: 32px; font-weight: 900; letter-spacing: 5px; }
      .ba-tag.before { left: 80px; background: var(--white); color: var(--black); }
      .ba-tag.after { right: 80px; background: var(--blue); color: var(--black); }
      .newb { position: absolute; left: 60px; top: 448px; padding: 6px 24px; border-radius: 12px; overflow: hidden;
        background: var(--laser); color: var(--black); font-size: 32px; font-weight: 900; letter-spacing: 6px; }
      .price { position: absolute; left: 60px; right: 60px; top: 1080px; padding: 26px 30px 34px; border-radius: 40px;
        background: rgba(0, 0, 0, 0.9); border: 3px solid rgba(255, 255, 255, 0.4); text-align: center;
        box-shadow: 0 0 60px rgba(0, 202, 224, 0.35); }
      .amt { font-size: 250px; font-weight: 900; line-height: 1; letter-spacing: -8px; background: var(--laser);
        -webkit-background-clip: text; background-clip: text; color: rgba(0, 0, 0, 0); }
      .or { font-size: 46px; font-weight: 800; letter-spacing: 2px; margin-top: 4px; }
      .fine { font-size: 22px; font-weight: 500; color: rgba(255, 255, 255, 0.85); margin-top: 18px; }

      .cta-head { position: absolute; left: 0; right: 0; top: 380px; text-align: center; }
      .cta-head .w { font-size: 150px; }
      .bubble { position: absolute; left: 70px; right: 70px; top: 860px; height: 230px; border-radius: 48px;
        background: rgba(0, 0, 0, 0.88); border: 3px solid var(--blue); display: flex; align-items: center; gap: 30px; padding: 0 36px;
        box-shadow: 0 0 80px rgba(0, 202, 224, 0.4), 0 40px 100px rgba(0, 0, 0, 0.9); }
      .av { width: 130px; height: 130px; border-radius: 50%; background: var(--laser); flex: none; }
      .btxt { flex: 1; }
      .btxt small { font-size: 28px; color: rgba(255, 255, 255, 0.8); font-weight: 500; }
      .typed { display: flex; align-items: center; gap: 6px; }
      .typed .tw { font-size: 96px; font-weight: 900; line-height: 1.1; }
      .caret { width: 8px; height: 90px; background: var(--blue); }
      .send { width: 120px; height: 120px; border-radius: 50%; background: var(--blue); display: flex; align-items: center; justify-content: center; flex: none; }
      .send svg, .plane svg { width: 64px; height: 64px; fill: var(--black); }
      .cta-sub { position: absolute; left: 0; right: 0; top: 1160px; text-align: center; font-size: 60px; font-weight: 700; }
      .plane { position: absolute; left: 862px; top: 915px; width: 120px; height: 120px; opacity: 0; display: flex; align-items: center; justify-content: center; }
      .plane svg { fill: var(--blue); width: 96px; height: 96px; }

      .burst { position: absolute; left: 140px; top: 560px; width: 800px; height: 800px; border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 202, 224, 0.45) 0%, rgba(0, 202, 224, 0) 62%); }
      .logo { position: absolute; inset: 0; perspective: 1600px; }
      .lg { position: absolute; display: block; }
      #s13-glow { filter: blur(26px) drop-shadow(0 0 30px #00cae0); opacity: 0.0; }
      .badge { overflow: hidden; border-radius: 26px; }
      .badge img { width: 100%; height: 100%; display: block; }
      .shine { position: absolute; top: -20px; left: -80px; width: 60px; height: 140%; transform: skewX(-20deg);
        background: rgba(255, 255, 255, 0.85); filter: blur(6px); }

      /* ---------- HUD ---------- */
      #hud { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
      #prog { position: absolute; left: 60px; right: 60px; top: 1812px; height: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
      #progfill { width: 100%; height: 100%; background: var(--bright); transform-origin: 0 50%; transform: scaleX(0); }
      .meta { position: absolute; top: 1846px; font-size: 22px; font-weight: 700; letter-spacing: 4px; color: rgba(255, 255, 255, 0.7); }
      #meta-l { left: 60px; } #meta-r { right: 60px; }

      /* ---------- transitions ---------- */
      #wipe { position: absolute; inset: 0; z-index: 50; overflow: hidden; pointer-events: none; }
      #wipeinner { position: absolute; inset: 0; }
      .wb { position: absolute; top: -240px; height: 2400px; transform: skewX(-18deg); }
      #wA { left: 0; width: 3200px; background: var(--blue); }
      #wB { left: 3200px; width: 140px; background: var(--laser); }
      #wC { left: -90px; width: 90px; background: var(--white); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="$TOTAL" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="$TOTAL" data-track-index="0" data-layout-ignore>
        <div class="blob" id="blob1"></div>
        <div class="blob" id="blob2"></div>
        <div class="blob" id="blob3"></div>
        <div id="grid"></div>
        <div id="ring2"></div>
        <div id="ring1"></div>
        $NUMS
        <div class="mark" style="left: 30px; top: 30px"></div>
        <div class="mark" style="right: 30px; top: 30px"></div>
        <div class="mark" style="left: 30px; bottom: 30px"></div>
        <div class="mark" style="right: 30px; bottom: 30px"></div>
      </div>

      <div id="stage" data-layout-allow-overflow>
        <div id="card">
          <div id="vw">
            $VIDEOS
            <div id="spot"></div>
            <div class="rip" id="r1" style="left: 1045px; top: 122px"></div>
            <div class="rip" id="r2a" style="left: 50px; top: 175px"></div>
            <div class="rip" id="r2b" style="left: 48px; top: 242px"></div>
            <div class="rip" id="r2c" style="left: 313px; top: 109px"></div>
            <div class="rip" id="r6a" style="left: 578px; top: 682px"></div>
            <div class="rip" id="r6b" style="left: 1477px; top: 195px"></div>
          </div>
          <div id="chrome"><i></i><i></i><i></i></div>
          <div id="gloss"></div>
          <div id="flash"></div>
        </div>
      </div>

      $SCENES

      <div id="hud" class="clip" data-start="0" data-duration="$HUD_DUR" data-track-index="3">
        <div id="prog"><div id="progfill"></div></div>
        <div class="meta" id="meta-l">CAPCUT PC &middot; AI VIDEO</div>
        <div class="meta" id="meta-r">OMNI REFERENCE</div>
      </div>

      <div id="wipe" class="clip" data-start="0" data-duration="$TOTAL" data-track-index="4" data-layout-ignore>
        <div id="wipeinner"><div class="wb" id="wC"></div><div class="wb" id="wA"></div><div class="wb" id="wB"></div></div>
      </div>

      $AUDIOS
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var S = $STARTS;
      var D = $DURS;
      var PH = $PHRASES;
      var K = $K;
      var TOTAL = $TOTAL;
      var CW = 1000, CH = 1000;
      var tl = gsap.timeline({ paused: true });
      function at(n, t) { return S[n] + t * K[n]; }
      function camV(cx, cy, z) { return { x: CW / 2 - cx * z, y: CH / 2 - cy * z, scale: z }; }
      function camSet(n, t, cx, cy, z) { tl.set("#vw", camV(cx, cy, z), at(n, t)); }
      function cam(n, t, cx, cy, z, d, e) {
        var v = camV(cx, cy, z); v.duration = Math.max(0.35, (d || 0.9) * K[n]); v.ease = e || "power3.inOut";
        tl.to("#vw", v, at(n, t));
      }
      function spot(n, t, x, y, w, h) {
        tl.to("#spot", { left: x - 8, top: y - 8, width: w + 16, height: h + 16, opacity: 1, duration: 0.45, ease: "power2.out" }, at(n, t));
      }
      function spotOff(n, t) { tl.to("#spot", { opacity: 0, duration: 0.3, ease: "power1.in" }, at(n, t)); }
      function rip(id, n, t) {
        tl.fromTo(id, { scale: 0.2, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.75, ease: "power2.out", immediateRender: false }, at(n, t));
      }
      function tilt(n, t, rx, ry) {
        tl.fromTo("#card", { rotationX: rx, rotationY: ry, scale: 0.9 },
          { rotationX: 0, rotationY: 0, scale: 1, duration: 1.0, ease: "power3.inOut", immediateRender: false }, at(n, t));
      }
      function flash(n, t) {
        tl.fromTo("#flash", { opacity: 0.45 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, at(n, t));
      }
      // shared scene entrance: pill + two headline lines + key phrases
      function enter(n) {
        tl.from("#s" + n + "-pill", { x: -60, opacity: 0, duration: 0.5, ease: "power3.out" }, at(n, 0.12));
        tl.from("#s" + n + "-l1", { yPercent: 110, duration: 0.6, ease: "expo.out" }, at(n, 0.18));
        tl.from("#s" + n + "-l2", { yPercent: 110, duration: 0.65, ease: "back.out(1.6)" }, at(n, 0.3));
        var p = PH[n] || [];
        for (var k = 0; k < p.length; k++) {
          var id = "#s" + n + "-p" + k;
          tl.fromTo(id, { y: 46, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, at(n, p[k]));
          if (k + 1 < p.length) tl.to(id, { opacity: 0, y: -30, duration: 0.2, ease: "power1.in" }, at(n, p[k + 1] - 0.2));
        }
      }

      // ---------- background ambience ----------
      tl.fromTo("#blob1", { x: 0, y: 0 }, { x: 160, y: 120, duration: 9, ease: "sine.inOut", yoyo: true, repeat: Math.floor(TOTAL / 9) - 1 }, 0);
      tl.fromTo("#blob2", { x: 0, y: 0 }, { x: -140, y: -180, duration: 11, ease: "sine.inOut", yoyo: true, repeat: Math.floor(TOTAL / 11) - 1 }, 0);
      tl.fromTo("#blob3", { scale: 1 }, { scale: 1.25, duration: 7, ease: "sine.inOut", yoyo: true, repeat: Math.floor(TOTAL / 7) - 1 }, 0);
      tl.fromTo("#grid", { y: 0 }, { y: 48 * 12, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo("#ring1", { rotation: 0 }, { rotation: 90, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo("#ring2", { rotation: 0 }, { rotation: -60, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo("#progfill", { scaleX: 0 }, { scaleX: 1, duration: S[9], ease: "none" }, 0);
      var NUMMAP = [null, "01", "01", "02", "03", "04", "05", "BF", "BF"];
      var prev = null;
      for (var n = 1; n <= 8; n++) {
        var id = "#num-" + NUMMAP[n];
        if (id !== prev) {
          if (prev) tl.set(prev, { opacity: 0 }, at(n, 0));
          tl.fromTo(id, { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out", immediateRender: false }, at(n, 0));
          prev = id;
        }
      }
      tl.set(prev, { opacity: 0 }, S[9]);

      // ---------- transitions: diagonal brand wipe covering every cut ----------
      tl.set("#wipeinner", { x: -4000 }, 0);
      for (var b = 2; b <= 10; b++) {
